name: Build KM Warm release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py
      - run: python scripts/lint.py
      - run: python -m unittest scripts/test_build.py -v
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/KM-Warm-lite-v3.6.min.css
            dist/KM-Warm-compat-v3.6.min.css
