name: Deploy generator to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p _site/assets/js _site/themes/km-warm _site/tools
          cp index.html _site/index.html
          cp chub-capture.html _site/chub-capture.html
          cp tools/chub-reference-capture.js _site/tools/chub-reference-capture.js
          cp assets/js/theme-project.js _site/assets/js/theme-project.js
          cp assets/js/css-workbench.js _site/assets/js/css-workbench.js
          cp assets/js/palettes.mjs _site/assets/js/palettes.mjs
          cp assets/js/chub-adapter.mjs _site/assets/js/chub-adapter.mjs
          cp themes/km-warm/source.css _site/themes/km-warm/source.css
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
