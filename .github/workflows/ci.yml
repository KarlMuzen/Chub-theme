name: CSS validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build.py
      - run: python scripts/lint.py
      - run: python scripts/check_generator.py
      - run: node --test scripts/test_theme_project.js
      - run: python -m unittest scripts/test_build.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: km-warm-css
          path: dist/*.css
